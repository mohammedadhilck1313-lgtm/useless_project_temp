<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SKIBIDI GPT</title>
    <style>
        body { font-family: Arial, sans-serif; background: #202123; color: #ececf1; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #343541; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #4d4d4f; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 70%; line-height: 1.4; }
        .user { background: #3b82f6; align-self: flex-end; }
        .bot { background: #444654; align-self: flex-start; }
        #input-container { padding: 20px; background: #343541; display: flex; gap: 10px; border-top: 1px solid #4d4d4f; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #565869; background: #40414f; color: white; outline: none; }
        button { padding: 12px 20px; border: none; background: #10a37f; color: white; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1a7f64; }
    </style>
</head>
<body>
    <header>SKIBIDI GPT</header>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Send a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
    <script>
        const history = new Set();
        function appendMessage(text, sender) {
            const chat = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }
        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim().toLowerCase();
            if (!text) return;
            appendMessage(input.value, 'user');
            input.value = '';
            setTimeout(() => {
                if (history.has(text)) {
                    appendMessage("It's you again, looser", 'bot');
                } else {
                    history.add(text);
                    appendMessage("I don't care", 'bot');
                }
            }, 500);
        }
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
